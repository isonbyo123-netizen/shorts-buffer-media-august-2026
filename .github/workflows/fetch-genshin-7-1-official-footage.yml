name: Fetch Genshin 7.1 official footage

on:
  push:
    paths:
      - ".github/workflows/fetch-genshin-7-1-official-footage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet requests
      - name: Download exact official sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p footage metadata
          python - <<'PY'
          import json, requests, subprocess, os, uuid
          ua='Mozilla/5.0 (Linux; Android 14; Pixel 8 Pro) AppleWebKit/537.36 Chrome/152 Mobile Safari/537.36'
          s=requests.Session()
          s.cookies.set('buvid3', str(uuid.uuid4()).upper()+'infoc')
          s.headers.update({'User-Agent':ua,'Referer':'https://www.bilibili.com/','Accept':'*/*'})
          items={
            'pv': {'bvid':'BV1yuY96rEL7','cid':41822257268,'out':'footage/01_genshin_7_1_pv_en','qn':64},
            'program': {'bvid':'BV1znY96NEvn','cid':41822653754,'out':'footage/02_genshin_7_1_special_program','qn':32}
          }
          meta={}
          for key,x in items.items():
            p={'bvid':x['bvid'],'cid':x['cid'],'qn':x['qn'],'fnval':0,'fnver':0,'fourk':0,'platform':'html5','high_quality':1}
            r=s.get('https://api.bilibili.com/x/player/playurl',params=p,timeout=30)
            print(key,'playurl',r.status_code,r.text[:500])
            r.raise_for_status(); data=r.json()
            if data.get('code')!=0 or not data.get('data',{}).get('durl'):
              raise RuntimeError(data)
            parts=[]
            for i,e in enumerate(data['data']['durl']):
              urls=[e['url']] + (e.get('backup_url') or [])
              part=f"{x['out']}_part{i:02d}.media"
              ok=False
              for url in urls:
                cmd=['curl','-L','--fail','--retry','20','--retry-delay','1','--retry-all-errors','--connect-timeout','20','--max-time','900','-C','-','-A',ua,'-e','https://www.bilibili.com/','-o',part,url]
                print(key,'curl',i,'expected',e.get('size'))
                try:
                  subprocess.run(cmd,check=True)
                  if e.get('size') and os.path.getsize(part) < int(e['size'])*0.98:
                    raise RuntimeError(f'incomplete file {os.path.getsize(part)}/{e["size"]}')
                  ok=True; break
                except Exception as ex:
                  print('curl failed',repr(ex))
              if not ok: raise RuntimeError('all cdn urls failed')
              parts.append(part)
            concat=x['out']+'_concat.txt'
            with open(concat,'w') as f:
              for pth in parts: f.write("file '%s'\n"%os.path.abspath(pth))
            subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','concat','-safe','0','-i',concat,'-c','copy',x['out']+'.mp4'],check=True)
            meta[key]={'bvid':x['bvid'],'cid':x['cid'],'quality':data['data'].get('quality'),'format':data['data'].get('format'),'bytes':sum(os.path.getsize(p) for p in parts)}
          with open('metadata/resolved.json','w') as f: json.dump(meta,f,indent=2)
          PY
          rm -f footage/*_part*.media footage/*_concat.txt
          ffmpeg -hide_banner -loglevel error -y -i footage/02_genshin_7_1_special_program.mp4 -vf "fps=1/30,scale=320:-2,tile=5x6" -q:v 3 metadata/program_contact_%02d.jpg
          ls -lh footage metadata
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genshin-7-1-official-footage
          path: |
            footage/*
            metadata/*
          retention-days: 7
          compression-level: 0
