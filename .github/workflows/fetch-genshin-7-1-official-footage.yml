name: Fetch Genshin 7.1 official footage

on:
  push:
    paths:
      - ".github/workflows/fetch-genshin-7-1-official-footage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade --quiet "yt-dlp[default,curl-cffi]"
          yt-dlp --version

      - name: Find latest official Genshin Twitch broadcasts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p footage metadata
          URL='https://www.twitch.tv/genshinimpactofficial/videos?filter=archives&sort=time'
          yt-dlp --flat-playlist --playlist-end 20 \
            --print '%(id)s\t%(title)s\t%(webpage_url)s' "$URL" | tee metadata/twitch_vods.txt

      - name: Download Version 7.1 Special Program from official Twitch
        shell: bash
        run: |
          set -euo pipefail
          VOD_ID=$(awk -F '\t' 'BEGIN{IGNORECASE=1} /7\.1|Rekviem|Underworld|Special Program/{print $1; exit}' metadata/twitch_vods.txt || true)
          if [ -z "$VOD_ID" ]; then
            echo 'No title match found; using newest archive from official Genshin Twitch channel.'
            VOD_ID=$(awk -F '\t' 'NF{print $1; exit}' metadata/twitch_vods.txt)
          fi
          test -n "$VOD_ID"
          echo "$VOD_ID" | tee metadata/selected_twitch_vod.txt
          yt-dlp --no-playlist --retries 10 --fragment-retries 10 --retry-sleep 3 \
            -f 'best[height<=1080]/best' --merge-output-format mp4 \
            --write-info-json \
            -o 'footage/01_genshin_7_1_special_program.%(ext)s' \
            "https://www.twitch.tv/videos/$VOD_ID"

      - name: Try official YouTube trailer and events as extra footage
        shell: bash
        continue-on-error: true
        run: |
          set +e
          try_download() {
            local url="$1" out="$2"
            for clients in 'web_safari,web_embedded' 'tv,web_embedded' 'android_vr,web_embedded' ''; do
              echo "Trying $url with clients: ${clients:-default}"
              args=(--no-playlist --retries 5 --fragment-retries 5 --retry-sleep 2 --merge-output-format mp4 -f 'bv*[height<=1080]+ba/b[height<=1080]')
              if [ -n "$clients" ]; then
                args+=(--extractor-args "youtube:player_client=$clients")
              fi
              yt-dlp "${args[@]}" -o "$out.%(ext)s" "$url" && return 0
              rm -f "$out".*
            done
            return 1
          }
          try_download 'https://www.youtube.com/watch?v=EwWbahV3qmU' 'footage/02_genshin_7_1_trailer'
          try_download 'https://www.youtube.com/watch?v=JbrNt_gewBI' 'footage/03_genshin_7_1_events_overview'
          exit 0

      - name: Build visual index and probe media
        shell: bash
        run: |
          set -euo pipefail
          PROGRAM=$(find footage -maxdepth 1 -type f -name '01_genshin_7_1_special_program.*' ! -name '*.json' | head -1)
          test -s "$PROGRAM"
          ffprobe -v error -show_entries format=duration,size -of json "$PROGRAM" | tee metadata/program_probe.json
          ffmpeg -hide_banner -loglevel error -y -i "$PROGRAM" \
            -vf 'fps=1/30,scale=320:-2,tile=5x6' -q:v 3 metadata/program_contact_%02d.jpg
          ls -lh footage metadata

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genshin-7-1-official-footage
          path: |
            footage/*
            metadata/*
          retention-days: 7
          compression-level: 0
