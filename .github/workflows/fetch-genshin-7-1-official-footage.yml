name: Fetch Genshin 7.1 official footage

on:
  push:
    paths:
      - ".github/workflows/fetch-genshin-7-1-official-footage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp, ffmpeg and Tor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tor
          python -m pip install --upgrade --quiet "yt-dlp[default,curl-cffi]"
          sudo service tor start
          sleep 8
          yt-dlp --version
          curl --socks5-hostname 127.0.0.1:9050 -fsS https://check.torproject.org/api/ip | tee /tmp/tor.json

      - name: Download official Genshin 7.1 YouTube footage with yt-dlp
        shell: bash
        run: |
          set -u
          mkdir -p footage metadata

          download_one() {
            url="$1"
            out="$2"
            success=0
            for attempt in 1 2 3; do
              echo "Attempt $attempt: $url"
              rm -f "$out".*
              yt-dlp \
                --proxy 'socks5://127.0.0.1:9050' \
                --no-playlist --retries 8 --fragment-retries 8 --retry-sleep 2 \
                --socket-timeout 30 \
                --extractor-args 'youtube:player_client=web_safari,web_embedded,tv' \
                -f 'bv*[height<=720]+ba/b[height<=720]' \
                --merge-output-format mp4 \
                --write-info-json \
                -o "$out.%(ext)s" "$url" && success=1 && break
              echo 'Request failed; asking Tor for a new circuit.'
              sudo killall -HUP tor || true
              sleep 8
            done
            return $((1-success))
          }

          ok=0
          download_one 'https://www.youtube.com/watch?v=EwWbahV3qmU' 'footage/01_genshin_7_1_trailer' && ok=$((ok+1)) || true
          download_one 'https://www.youtube.com/watch?v=JbrNt_gewBI' 'footage/02_genshin_7_1_events_overview' && ok=$((ok+1)) || true
          download_one 'https://www.youtube.com/watch?v=fSwBYIeAieo' 'footage/03_genshin_7_1_special_program' && ok=$((ok+1)) || true

          echo "$ok" | tee metadata/download_count.txt
          find footage -maxdepth 1 -type f -printf '%f %s bytes\n' | tee metadata/files.txt
          if [ "$ok" -lt 2 ]; then
            echo "Only $ok official videos downloaded; failing for inspection."
            exit 1
          fi

      - name: Probe footage and create contact sheets
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p metadata
          for f in footage/*.mp4 footage/*.webm footage/*.mkv; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            ffprobe -v error -show_entries format=duration,size -of json "$f" > "metadata/${base}.probe.json"
            ffmpeg -hide_banner -loglevel error -y -i "$f" -vf 'fps=1/20,scale=320:-2,tile=5x6' -frames:v 6 -q:v 4 "metadata/${base}_contact_%02d.jpg"
          done
          ls -lh footage metadata || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genshin-7-1-official-footage
          path: |
            footage/*
            metadata/*
          retention-days: 7
          compression-level: 0
