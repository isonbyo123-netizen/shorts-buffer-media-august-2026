name: Fetch September 9-10 ZZZ footage

on:
  push:
    paths:
      - ".github/workflows/fetch-sep9-10-footage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install downloader
        run: |
          curl -L --fail https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o /tmp/yt-dlp
          chmod +x /tmp/yt-dlp
      - name: Download official ZZZ sources with embedded clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p footage
          fetch_video() {
            local id="$1"
            local out="$2"
            for client in web_embedded tv_embedded web_safari android_vr; do
              rm -f "footage/${out}".*
              if /tmp/yt-dlp --js-runtimes node --no-playlist --extractor-args "youtube:player_client=${client}" -f "bv*[height<=1080]/bestvideo[height<=1080]" -o "footage/${out}.%(ext)s" "https://www.youtube.com/watch?v=${id}"; then
                return 0
              fi
            done
            return 1
          }
          fetch_video "4O-Iq8lj9_k" "01_zzz32_teaser"
          fetch_video "kdGJDZb6mWk" "02_zzz32_program"
          fetch_video "VjNhciBWgug" "03_claret_demo"
          fetch_video "Ln0ilmPqXU0" "04_claret_ep"
      - name: Verify sources
        run: ffprobe -v error -show_entries format=filename,duration,size -of csv=p=0 footage/*
      - uses: actions/upload-artifact@v4
        with:
          name: sep9-10-zzz32-footage
          path: footage/*
          retention-days: 7
          compression-level: 0
