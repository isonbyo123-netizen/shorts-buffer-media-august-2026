name: Fetch September 9-10 ZZZ footage

on:
  push:
    paths:
      - ".github/workflows/fetch-sep9-10-footage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install downloader
        run: |
          curl -L --fail https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o /tmp/yt-dlp
          chmod +x /tmp/yt-dlp
      - name: List official ZZZ uploads
        run: |
          set -euo pipefail
          mkdir -p footage
          /tmp/yt-dlp --flat-playlist --playlist-end 80 --dump-single-json "https://space.bilibili.com/1636034895/video" > footage/official_zzz_uploads.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-zzz-upload-list
          path: footage/official_zzz_uploads.json
          retention-days: 2
