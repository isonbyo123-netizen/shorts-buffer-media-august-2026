name: Fetch September 9-10 ZZZ footage

on:
  push:
    paths:
      - ".github/workflows/fetch-sep9-10-footage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install downloader
        run: |
          curl -L --fail https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o /tmp/yt-dlp
          chmod +x /tmp/yt-dlp
      - name: Download official ZZZ videos from official X posts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p footage
          /tmp/yt-dlp --no-playlist -f "bestvideo+bestaudio/best" --merge-output-format mp4 -o "footage/01_zzz32_teaser.%(ext)s" "https://x.com/ZZZ_EN/status/2093310125318562233"
          /tmp/yt-dlp --no-playlist -f "bestvideo+bestaudio/best" --merge-output-format mp4 -o "footage/02_claret_demo.%(ext)s" "https://x.com/ZZZ_EN/status/2095723527446118412"
          ls -lh footage
      - uses: actions/upload-artifact@v4
        with:
          name: sep9-10-zzz32-footage
          path: footage/*
          retention-days: 7
          compression-level: 0
